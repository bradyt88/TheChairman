name: Repair match injuries

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'bradyt88'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add injury-driven substitutions
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('js/simulation.js')
          s=p.read_text()
          start=s.index('function applySubstitutions(')
          end=s.index('function simulateSquadMatch',start)
          replacement='''function applySubstitutions(state,selection,result,seed){const starters=selection.selected.slice(),bench=selection.bench.slice(0,7),changes=[];const availableSubs=bench.slice();const forced=[];starters.forEach((p,i)=>{if(seededUnit(seed+401+i*17)<.025){p.injuryWeeks=Math.max(p.injuryWeeks||0,1);forced.push(p);}});const fatigue=starters.filter(p=>!forced.some(x=>x.id===p.id)).map(p=>({p,score:Math.max(0,100-(p.fitness||80))+Math.max(0,((p.minutes||0)/(Math.max(1,p.appearances||1))-65))})).sort((a,b)=>b.score-a.score);const desired=Math.min(5,availableSubs.length,1+Math.floor(seededUnit(seed+5)*5));const outgoingPool=[...forced,...fatigue.map(x=>x.p)];for(let i=0;i<Math.min(desired,outgoingPool.length);i++){const outgoing=outgoingPool[i];if(!outgoing||!availableSubs.length)break;const group=positionGroup(outgoing.position);let idx=availableSubs.findIndex(p=>positionGroup(p.position)===group&&(p.injuryWeeks||0)<=0);if(idx<0)idx=availableSubs.findIndex(p=>(p.injuryWeeks||0)<=0);if(idx<0)break;const incoming=availableSubs.splice(idx,1)[0];changes.push({outgoing:outgoing.id,incoming:incoming.id,minute:forced.some(x=>x.id===outgoing.id)?48+Math.floor(seededUnit(seed+i*13)*18):58+Math.floor(seededUnit(seed+i*19)*25),reason:forced.some(x=>x.id===outgoing.id)?'injury':'manager rotation'});}}\nreturn changes;}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
      - name: Validate and commit
        shell: bash
        run: |
          node --input-type=module --check < js/simulation.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/simulation.js
          git diff --cached --quiet || git commit -m 'Make injuries affect match substitutions'
          git push
