name: Fix matchday won error
on:
  push:
    paths:
      - '.github/workflows/fix-won-error.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch simulation and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/simulation.js')
          s=p.read_text()
          if 'let won=false,lost=false;' not in s:
              m=re.search(r'(function advanceWeek\([^)]*\)\{)',s)
              if not m:
                  raise SystemExit('advanceWeek function not found')
              s=s[:m.end()]+'let won=false,lost=false;'+s[m.end():]
          # Set the outcome after the match result is created, if the function contains that assignment.
          marker='let won=false,lost=false;'
          if 'won=home?' not in s:
              start=s.find(marker)
              end=s.find('\n',start)
              body_end=s.find('\nexport ', end+1)
              segment=s[start:body_end if body_end!=-1 else len(s)]
              hit=re.search(r'((?:const|let|var)\s+result\s*=\s*matchResult\([^;]+;)',segment)
              if hit:
                  line_end=start+hit.end()
                  assignment="const [__homeGoals,__awayGoals]=parseGoals(result);won=home?__homeGoals>__awayGoals:__awayGoals>__homeGoals;lost=home?__homeGoals<__awayGoals:__awayGoals<__homeGoals;"
                  s=s[:line_end]+assignment+s[line_end:]
          p.write_text(s)
          idx=Path('index.html'); h=idx.read_text().replace('?v=90','?v=91'); idx.write_text(h)
          wf=Path('.github/workflows/fix-won-error.yml'); wf.unlink()
          if 'let won=false,lost=false;' not in p.read_text(): raise SystemExit('validation failed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/simulation.js index.html .github/workflows/fix-won-error.yml
          git commit -m 'Fix matchday decision runtime error'
          git push
