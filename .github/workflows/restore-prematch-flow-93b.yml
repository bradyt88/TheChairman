name: Restore pre-match start screen correctly
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch matchday flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/matchday-fix.js')
          s=p.read_text()
          s=s.replace("./simulation.js?matchday=92", "./simulation.js?matchday=93")
          marker="function renderMatchday(state,world,players){"
          if marker not in s: raise SystemExit('render marker missing')
          prematch="""function renderPreMatch(state,world,players){const neutral=previewMatchday(state,world,'neutral',players),t=teams(state,world,neutral);activeMatch={state,world,players,week:neutral.week,home:neutral.home,opponent:neutral.opponent,homeTeam:t.homeTeam,awayTeam:t.awayTeam};overlay(`${header(`Matchday · Week ${neutral.week}`,'Matchday',`${esc(t.homeTeam)} vs ${esc(t.awayTeam)}`)}${fixtureLine({...neutral,...t},'—')}<div style=\"margin-top:18px;padding:16px;border-radius:10px;background:rgba(214,178,82,.08);border:1px solid rgba(214,178,82,.16)\"><strong>Pre-match</strong><div style=\"opacity:.75;margin-top:5px\">The manager has prepared the team. The manager controls the starting XI and substitutions. Match statistics appear once the game starts.</div></div><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px\"><button type=\"button\" data-fix-start style=\"padding:16px;border:1px solid rgba(214,178,82,.4);border-radius:10px;background:#b99645;color:#0b0f15;font-weight:900;cursor:pointer;touch-action:manipulation\">Start Match</button><button type=\"button\" data-fix-prematch-skip style=\"padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#111720;color:inherit;font-weight:800;cursor:pointer;touch-action:manipulation\">Skip Match</button></div>`);}"""
          s=s.replace(marker,prematch+"\n"+marker,1)
          old="const players=generatePlayers(world.clubs);renderMatchday(state,world,players);"
          new="const players=generatePlayers(world.clubs);renderPreMatch(state,world,players);"
          if old not in s: raise SystemExit('advance call missing')
          s=s.replace(old,new,1)
          anchor="document.addEventListener('click',async e=>{const b=e.target.closest?.('[data-action=\\\"advance\\\"]');"
          if anchor not in s: raise SystemExit('advance listener anchor missing')
          insert="""document.addEventListener('click',async e=>{const start=e.target.closest?.('[data-fix-start]'),skip=e.target.closest?.('[data-fix-prematch-skip]');if(!start&&!skip)return;e.preventDefault();e.stopImmediatePropagation();if(busy)return;busy=true;try{const{state,world,players}=activeMatch||{};if(!state||!world||!players)throw new Error('Matchday state could not be loaded.');if(start){renderMatchday(state,world,players);}else{const neutral=previewMatchday(state,world,'neutral',players);finishSkipped(state,world,players,neutral);}}catch(err){console.error(err);showError(err);}finally{busy=false;}},true);\n"""
          s=s.replace(anchor,insert+anchor,1)
          p.write_text(s)
          p=Path('index.html');p.write_text(p.read_text().replace('?v=92','?v=93'))
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/matchday-fix.js index.html
          git commit -m 'Restore pre-match start screen'
          git push
      - name: Remove one-shot workflows
        if: success()
        run: |
          rm -f .github/workflows/restore-prematch-flow-93.yml .github/workflows/restore-prematch-flow-93b.yml
          git add -A .github/workflows
          git commit -m 'Remove one-shot pre-match workflows' || true
          git push || true
