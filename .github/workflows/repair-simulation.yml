name: Repair simulation syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed unused-player expression
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('js/simulation.js')
          s = p.read_text()
          bad = 'map(p=>({...p));'
          good = 'map(p=>({...p}));'
          if bad not in s:
              print('Malformed expression not present; no repair required.')
              raise SystemExit(0)
          p.write_text(s.replace(bad, good, 1))
          print('Repaired simulation.js')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/simulation.js
          git commit -m 'Fix simulation syntax error in unused-player mapping'
          git push
