name: Fix matchday screen

on:
  push:
    paths:
      - '.github/workflows/fix-matchday-screen.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch matchday flow and simulation stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          sim = Path('js/simulation.js')
          text = sim.read_text()

          marker = "function halfTimeFromResult(result,seed){"
          if 'function matchStatsFor(' not in text:
              helper = r'''function matchStatsFor(state,world,decision,home,opp,result,teamPower,opponentPower){
const [hg,ag]=parseGoals(result),gap=teamPower-opponentPower+(home?2.2:0)+(decision==='demand'?1.8:decision==='protect'?-1.2:decision==='support'?.8:0),seed=(state.week+1)*401+(state.clubId?.length||7)*17;
const homePoss=clamp(Math.round(50+clamp(gap*.55,-12,12)+seededVariation(seed)*4),35,65),awayPoss=100-homePoss;
const homeShots=clamp(Math.max(hg+3,Math.round(8+gap*.07+seededUnit(seed+3)*6+hg*.8)),3,24),awayShots=clamp(Math.max(ag+3,Math.round(8-gap*.07+seededUnit(seed+5)*6+ag*.8)),3,24);
const homeSot=clamp(Math.max(hg,Math.round(homeShots*(.32+seededUnit(seed+7)*.18))),hg,homeShots),awaySot=clamp(Math.max(ag,Math.round(awayShots*(.32+seededUnit(seed+9)*.18))),ag,awayShots);
const half=halfTimeFromResult(result,(state.week+1)*31),[hh,ha]=parseGoals(half),firstRatio=0.46+seededVariation(seed+11)*.07;
const halfHomeShots=clamp(Math.max(hh+1,Math.round(homeShots*firstRatio)),0,homeShots),halfAwayShots=clamp(Math.max(ha+1,Math.round(awayShots*(firstRatio+.02))),0,awayShots);
const halfHomeSot=clamp(Math.max(hh,Math.round(homeSot*firstRatio)),hh,homeSot),halfAwaySot=clamp(Math.max(ha,Math.round(awaySot*firstRatio)),ha,awaySot);
return {homePossession:homePoss,awayPossession:awayPoss,homeShots,awayShots,homeShotsOnTarget:homeSot,awayShotsOnTarget:awaySot,halfTime:{homePossession:homePoss,awayPossession:awayPoss,homeShots:halfHomeShots,awayShots:halfAwayShots,homeShotsOnTarget:halfHomeSot,awayShotsOnTarget:halfAwaySot,minutes:45},corners:clamp(Math.round((homeShots+awayShots)*.34+seededUnit(seed+13)*3),2,14),fouls:clamp(Math.round(17+seededUnit(seed+15)*10),10,32),yellowCards:clamp(Math.round(seededUnit(seed+17)*5),0,5)};
}
'''
              text = text.replace(marker, helper + marker, 1)

          old_preview = "export function previewMatchday(state,world,decision='neutral',playerPool=[]){const preview=matchResult(state,world,decision,playerPool);return{...preview,halfTimeResult:halfTimeFromResult(preview.result,preview.week*31)};}"
          new_preview = "export function previewMatchday(state,world,decision='neutral',playerPool=[]){const preview=matchResult(state,world,decision,playerPool),club=world.clubs.find(c=>c.id===state.clubId),opp=preview.opponent,teamPower=teamStrengthFor(state.players),opponentPlayers=(playerPool||[]).filter(p=>p.clubId===opp?.id),opponentPower=opponentPlayers.length?teamStrengthFor(opponentPlayers):opp?.reputation||50,stats=matchStatsFor(state,world,decision,preview.home,opp,preview.result,teamPower,opponentPower);return{...preview,halfTimeResult:halfTimeFromResult(preview.result,preview.week*31),stats,halfTimeStats:stats.halfTime};}"
          if old_preview not in text:
              raise SystemExit('previewMatchday pattern not found')
          text = text.replace(old_preview,new_preview,1)

          old_wl = "won=['1–0','2–0','2–1','3–1'].includes(result),lost=['0–1','0–2','1–2'].includes(result),updatedPlayers="
          new_wl = "[rh,ra]=parseGoals(result),won=rh>ra,lost=rh<ra,matchStats=matchStatsFor(s,world,decision,home,opp,result,power,opponentPower),updatedPlayers="
          if old_wl not in text:
              raise SystemExit('win/loss pattern not found')
          text = text.replace(old_wl,new_wl,1)

          old_last = "s.lastMatch={opponent:opp?.name||'League Opponent',home,result,headline:decision==='support'?"
          new_last = "s.lastMatch={opponent:opp?.name||'League Opponent',home,result,stats:matchStats,halfTimeStats:matchStats.halfTime,headline:decision==='support'?"
          if old_last not in text:
              raise SystemExit('lastMatch pattern not found')
          text = text.replace(old_last,new_last,1)

          sim.write_text(text)

          md = Path('js/matchday-fix.js')
          md.write_text(r'''import { loadWorld, generatePlayers } from './data.js';
import { loadGame, saveGame } from './storage.js';
import { advanceWeek, previewMatchday } from './simulation.js';

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseScore=result=>{const m=String(result).match(/(\d+)\s*[–-]\s*(\d+)/);return m?[+m[1],+m[2]]:[0,0];};
const seeded=seed=>{const x=Math.sin(seed*12.9898)*43758.5453;return x-Math.floor(x);};
function overlay(html){document.getElementById('matchday-fix-overlay')?.remove();const el=document.createElement('div');el.id='matchday-fix-overlay';el.innerHTML=`<div style="position:fixed;inset:0;background:rgba(3,6,10,.88);backdrop-filter:blur(8px);z-index:99999;display:grid;place-items:center;padding:18px;pointer-events:auto"><div style="width:min(900px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#151b25,#0b0f15);border:1px solid rgba(214,178,82,.25);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55);color:#f4f5f7;padding:22px">${html}</div></div>`;document.body.appendChild(el);return el;}
function close(){document.getElementById('matchday-fix-overlay')?.remove();}
function header(label,title,fixture){return `<div><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65">${esc(label)}</div><h2 style="margin:6px 0">${esc(title)}</h2><div style="opacity:.7">${fixture}</div></div>`;}
function fixtureLine(p,score){return `<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:18px 0"><div style="text-align:right;font-weight:800">${esc(p.homeTeam)}</div><div style="font-size:30px;font-weight:900;letter-spacing:.05em">${score}</div><div style="font-weight:800">${esc(p.awayTeam)}</div></div>`;}
function statGrid(r,label='Match stats'){return `<div><div style="font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px">${label}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px"><small style="opacity:.6">Possession</small><strong style="display:block;margin-top:4px">${r.homePossession}% · ${r.awayPossession}%</strong></div><div style="padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px"><small style="opacity:.6">Shots</small><strong style="display:block;margin-top:4px">${r.homeShots} · ${r.awayShots}</strong></div><div style="padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px"><small style="opacity:.6">On target</small><strong style="display:block;margin-top:4px">${r.homeShotsOnTarget} · ${r.awayShotsOnTarget}</strong></div><div style="padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px"><small style="opacity:.6">Phase</small><strong style="display:block;margin-top:4px">${r.minutes||90} minutes</strong></div></div></div>`;}
function teams(state,world,p){const club=world.clubs.find(c=>c.id===state.clubId),home=p.home;return{homeTeam:home?club?.name:(p.opponent?.name||'League Opponent'),awayTeam:home?(p.opponent?.name||'League Opponent'):club?.name};}
function commonHalf(previews){const ss=previews.map(p=>parseScore(p.halfTimeResult||p.result));return [Math.min(...ss.map(s=>s[0])),Math.min(...ss.map(s=>s[1]))];}
function lockedResult(half,result){const [hh,ha]=parseScore(half),[fh,fa]=parseScore(result);return `${Math.max(hh,fh)}–${Math.max(ha,fa)}`;}
function eventTimeline(homeTeam,awayTeam,halfResult,finalResult){const [hh,ha]=parseScore(halfResult),[fh,fa]=parseScore(finalResult),events=[],seedBase=(fh+fa+hh+ha)*91;const add=(count,start,end,homeCount,offset)=>{for(let i=0;i<count;i++){const m=start+Math.floor(seeded(seedBase+offset+i*13)*(end-start+1));events.push({minute:m,team:i<homeCount?homeTeam:awayTeam,type:'goal'});}};add(hh+ha,8,45,hh,11);add((fh-hh)+(fa-ha),48,90,fh-hh,37);return events.sort((a,b)=>a.minute-b.minute);}
function options(report){const [h,a]=parseScore(report.halfTime),clubScore=report.home?h:a,oppScore=report.home?a:h;return clubScore>oppScore?[{id:'support',title:'Back the manager',text:'Keep confidence high and trust the football staff.',effect:'Balanced second half'},{id:'protect',title:'Protect the lead',text:'Urge control and game management.',effect:'Lower risk / controlled approach'},{id:'demand',title:'Push for more',text:'Demand that the team stays on the front foot.',effect:'Higher attacking intent / higher risk'}]:[{id:'support',title:'Back the manager',text:'Keep confidence high and trust the football staff.',effect:'Balanced second half'},{id:'demand',title:'Demand a response',text:'Expect a stronger second half.',effect:'Higher attacking intent / higher risk'},{id:'protect',title:'Urge control',text:'Stabilise the match and avoid further damage.',effect:'Lower risk / controlled approach'}];}
function reportFor(state,world,p,decision,halfOverride){const t=teams(state,world,p),half=halfOverride||p.halfTimeResult||'0–0',final=lockedResult(half,p.result),stats=p.stats||{},halfStats=p.halfTimeStats||stats;return{...p,...t,decision,halfTime:half,final,stats,halfStats,events:eventTimeline(t.homeTeam,t.awayTeam,half,final)};}
function renderMatchday(state,world,allPlayers){const neutral=previewMatchday(state,world,'neutral',allPlayers),choices=['support','demand','protect'].map(d=>previewMatchday(state,world,d,allPlayers)),half=commonHalf(choices),base=reportFor(state,world,neutral,'pending',`${half[0]}–${half[1]}`);overlay(`${header(`Matchday · Week ${base.week}`,'Director’s Box',`${esc(base.homeTeam)} vs ${esc(base.awayTeam)}`)}${fixtureLine(base,base.halfTime)}<div style="padding:14px 16px;border-radius:10px;background:rgba(214,178,82,.08);border:1px solid rgba(214,178,82,.16);margin-bottom:16px"><strong>Half-time state is locked.</strong><div style="opacity:.75;margin-top:4px">These are the first-half match statistics. They remain fixed while you make the chairman decision.</div></div>${statGrid(base.halfStats,'First-half stats')}<div style="margin-top:18px"><div style="font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.12em">Chairman intervention</div><div id="matchday-options" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">${options(base).map(o=>`<button type="button" data-fix-decision="${o.id}" style="padding:14px;text-align:left;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#111720;color:inherit;cursor:pointer;touch-action:manipulation"><strong>${esc(o.title)}</strong><span style="display:block;font-size:12px;opacity:.65;margin-top:6px">${esc(o.text)}</span><small style="display:block;margin-top:10px;color:#d6b252">${esc(o.effect)}</small></button>`).join('')}</div></div><div style="margin-top:18px;display:flex;justify-content:flex-end"><button type="button" data-fix-skip style="padding:11px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:inherit;cursor:pointer;touch-action:manipulation">Skip this match instead</button></div>`);}
function showError(err){const el=document.querySelector('#matchday-fix-overlay > div > div');if(el)el.insertAdjacentHTML('beforeend',`<div style="margin-top:16px;padding:12px;border:1px solid rgba(220,80,80,.4);border-radius:10px;color:#ffb4b4">Matchday error: ${esc(err?.message||err)}</div>`);}
async function finish(state,world,allPlayers,decision,base){try{const finalPreview=previewMatchday(state,world,decision,allPlayers),final=lockedResult(base.halfTime,finalPreview.result);state.pendingMatchdayDecision=decision;state.pendingMatchdayResult=final;const next=advanceWeek(state,world,allPlayers);next.lastMatch=next.lastMatch||{};next.lastMatch.halfTime=base.halfTime;next.lastMatch.finalResult=final;next.lastMatch.homeScore=parseScore(final)[0];next.lastMatch.awayScore=parseScore(final)[1];next.lastMatch.report={...base,decision,final,stats:next.lastMatch.stats||finalPreview.stats,halfStats:base.halfStats};saveGame(next);showResult(next,next.lastMatch.report,'Match complete');}catch(err){console.error(err);showError(err);}}
async function skip(state,world,allPlayers,base){try{const p=previewMatchday(state,world,'neutral',allPlayers),final=lockedResult(base.halfTime,p.result);state.pendingMatchdayDecision='neutral';state.pendingMatchdayResult=final;const next=advanceWeek(state,world,allPlayers);next.lastMatch=next.lastMatch||{};next.lastMatch.halfTime=base.halfTime;next.lastMatch.finalResult=final;next.lastMatch.homeScore=parseScore(final)[0];next.lastMatch.awayScore=parseScore(final)[1];next.lastMatch.report={...base,decision:'neutral',final,stats:next.lastMatch.stats||p.stats,halfStats:base.halfStats};saveGame(next);showResult(next,next.lastMatch.report,'Match simulated');}catch(err){console.error(err);showError(err);}}
function showResult(state,r,title){const stats=r.stats||{},[fh,fa]=parseScore(r.final),timeline=r.events?.map(e=>`<div style="display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)"><strong>${e.minute}'</strong><span>${esc(e.team)} — Goal</span></div>`).join('')||'<div style="opacity:.65;padding:10px 0">No recorded incidents.</div>';overlay(`${header(`Full-time · Week ${state.week}`,title,`${esc(r.homeTeam)} vs ${esc(r.awayTeam)}`)}${fixtureLine(r,`${fh}–${fa}`)}<div style="padding:14px 16px;border-radius:10px;background:rgba(214,178,82,.08);border:1px solid rgba(214,178,82,.16)"><strong>Half-time ${esc(r.halfTime)} · Full-time ${fh}–${fa}</strong><div style="opacity:.72;margin-top:4px">The final score and statistics come from the same match simulation.</div></div><div style="margin-top:16px">${statGrid(stats,'Full-time stats')}</div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button type="button" data-fix-close style="padding:11px 18px;border-radius:8px;border:1px solid rgba(214,178,82,.4);background:#b99645;color:#0b0f15;font-weight:800;cursor:pointer;touch-action:manipulation">Return to Chairman HQ</button></div>`);}
let busy=false;document.addEventListener('click',async e=>{const decision=e.target.closest?.('[data-fix-decision]'),skipBtn=e.target.closest?.('[data-fix-skip]'),closeBtn=e.target.closest?.('[data-fix-close]');if(closeBtn){e.preventDefault();e.stopImmediatePropagation();close();location.reload();return;}if(!decision&&!skipBtn)return;e.preventDefault();e.stopImmediatePropagation();if(busy)return;busy=true;const buttons=document.querySelectorAll('[data-fix-decision],[data-fix-skip]');buttons.forEach(b=>b.disabled=true);try{const world=await loadWorld(),state=loadGame();if(!state)throw new Error('Game state could not be loaded.');const players=generatePlayers(world.clubs);const current=state.lastMatch?.halfTime?{...state.lastMatch,halfTimeResult:state.lastMatch.halfTime,result:state.lastMatch.finalResult}:previewMatchday(state,world,'neutral',players);if(decision){const t=teams(state,world,current);const base={...current,...t,halfTime:current.halfTimeResult||'0–0',halfStats:current.halfTimeStats||current.stats||{}};await finish(state,world,players,decision.dataset.fixDecision,base);}else{const t=teams(state,world,current);const base={...current,...t,halfTime:current.halfTimeResult||'0–0',halfStats:current.halfTimeStats||current.stats||{}};await skip(state,world,players,base);}}catch(err){console.error(err);showError(err);}finally{busy=false;}},true);
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-action="advance"]');if(!b||busy)return;busy=true;e.preventDefault();e.stopImmediatePropagation();loadWorld().then(world=>{const state=loadGame();if(!state){busy=false;return;}const players=generatePlayers(world.clubs);renderMatchday(state,world,players);busy=false;}).catch(err=>{busy=false;console.error(err);alert('Matchday failed to open: '+err.message);});},true);
''')

          # Cache-bust the production page.
          idx=Path('index.html')
          html=idx.read_text()
          html=html.replace('?v=89','?v=90')
          idx.write_text(html)

          # Hard validation: all new simulation hooks must exist.
          check=sim.read_text()
          for needle in ['function matchStatsFor(','stats,halfTimeStats','[rh,ra]=parseGoals(result),won=rh>ra']:
              if needle not in check:
                  raise SystemExit(f'validation failed: {needle}')
          mdcheck=md.read_text()
          for needle in ['data-fix-decision','data-fix-skip','stopImmediatePropagation','The final score and statistics come from the same match simulation.']:
              if needle not in mdcheck:
                  raise SystemExit(f'matchday validation failed: {needle}')
          print('PATCH_VALIDATED')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/simulation.js js/matchday-fix.js index.html
          git commit -m "Fix matchday controls and simulation stats" || exit 0
          git push
