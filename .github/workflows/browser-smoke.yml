name: Browser smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm init -y && npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test live site
        shell: bash
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(`PAGEERROR: ${e.message}`));
          page.on('console', m => { if (m.type() === 'error') errors.push(`CONSOLE: ${m.text()}`); });
          await page.goto('https://bradyt88.github.io/TheChairman/', {waitUntil:'networkidle', timeout:60000});
          await page.waitForTimeout(3000);
          const text = await page.locator('body').innerText();
          console.log(text.slice(0,2000));
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          if (text.includes('failed to start') || text.includes('JavaScript startup error') || text.includes('Runtime diagnostic')) process.exit(2);
          await browser.close();
          EOF
          node smoke.mjs
